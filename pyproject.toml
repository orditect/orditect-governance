# Workspace tooling configuration for the orditect-governance repo.
# The repository root is NOT a package: distributions live under
# packages/* (ordigovernance-api, ordigovernance-runtime, ...).
# This file only carries shared pytest and ruff configuration.

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "strict"
filterwarnings = [
    # Upstream-only: starlette's TestClient module still references the
    # deprecated anyio.abc.BlockingPortal alias at import time
    # (verified present in starlette 1.6.0 with anyio 4.15.1). Not
    # fixable from this repository; remove this entry when starlette
    # migrates to anyio.from_thread.BlockingPortal. The ignore is
    # pinned to the exact message + module so every other warning,
    # including future starlette deprecations, stays visible.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette",
]
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/egg-info/**", "data/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B011"]