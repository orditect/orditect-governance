name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts skips isolated-vm's node-gyp postinstall
      # (pulled transitively by the types-only n8n-workflow dev dep);
      # builds and tests never touch it. See README "Node note".
      - run: npm install --ignore-scripts

      - run: npm run build

      - run: npm test