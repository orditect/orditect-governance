[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordigovernance-testing"
version = "0.1.0"
description = "Golden trace normalization, conformance kit and deterministic mocks for ordigovernance"
requires-python = ">=3.12"
license = { text = "SUL-1.0" }
dependencies = [
    "ordigovernance-api>=0.1.0",
    "orditect-flow>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"ordigovernance.testing" = ["py.typed"]