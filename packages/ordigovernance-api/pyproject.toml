[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordigovernance-api"
version = "0.1.0"
description = "Public protocols, contracts and policy vocabulary of the ordigovernance governance stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "SUL-1.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true