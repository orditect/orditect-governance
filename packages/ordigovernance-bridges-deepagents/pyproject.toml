[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordigovernance-bridges-deepagents"
version = "0.1.0"
description = "DeepAgents bridge: thin shells over ordigovernance tracked atoms"
requires-python = ">=3.12"
license = { text = "SUL-1.0" }
dependencies = [
    "langchain-core>=0.3",
    "ordigovernance-api>=0.1.0",
    "ordigovernance-bridges-langgraph>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
deepagents = ["deepagents>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"ordigovernance.bridges.deepagents" = ["py.typed"]
