
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordigovernance-bridges-direct"
version = "0.1.0"
description = "Direct bridge: governed runs without an orchestration framework"
requires-python = ">=3.12"
license = { text = "SUL-1.0" }
dependencies = [
    "ordigovernance-runtime>=0.1.0",
    "orditect-core>=0.1.0",
    "orditect-flow>=0.1.0",
    "orditect-adapter-memory>=0.1.0",
    "orditect-bridge-openai>=0.1.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"ordigovernance.bridges.direct" = ["py.typed"]