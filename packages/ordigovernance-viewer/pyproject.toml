[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordigovernance-viewer"
version = "0.1.0"
description = "Cold-path viewer: FastAPI routers and dashboard UI for ordigovernance trace evidence"
requires-python = ">=3.12"
license = { text = "SUL-1.0" }
dependencies = [
    "fastapi>=0.110",
    "ordigovernance-api>=0.1.0",
    "ordigovernance-runtime>=0.1.0",
    "orditect-protocol>=0.1.0",
]

[project.optional-dependencies]
quickstart = [
    "uvicorn>=0.29",
    "ordigovernance-testing>=0.1.0",
    "orditect-adapter-memory>=0.1.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]


[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"ordigovernance.viewer" = ["ui/*", "ui/core/*", "py.typed"]