[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordigovernance-bridges-langgraph"
version = "0.1.0"
description = "LangChain/LangGraph bridge: thin format-translation shells over ordigovernance tracked atoms"
requires-python = ">=3.12"
license = { text = "SUL-1.0" }
dependencies = [
    "langchain-core>=0.3",
    "ordigovernance-api>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"ordigovernance.bridges.langgraph" = ["py.typed"]